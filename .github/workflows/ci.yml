name: CI

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Prepare Gradle wrapper
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > Examen2/local.properties
          chmod +x Examen2/gradlew

      - name: Build
        working-directory: Examen2
        run: ./gradlew :app:assembleDebug

  test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Prepare Gradle wrapper
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > Examen2/local.properties
          chmod +x Examen2/gradlew

      - name: Run unit tests
        working-directory: Examen2
        run: ./gradlew :app:testDebugUnitTest
